<div class="fixed inset-0 bg-black/30 backdrop-blur-sm z-40 transition-all duration-300" 
  *ngIf="isOpen" 
  (click)="closeModal()"
  [class.opacity-0]="!isOpen"
  [class.opacity-100]="isOpen">
</div>

<div class="fixed inset-0 flex items-center justify-center z-50 transition-all duration-300" 
  *ngIf="isOpen"
  [class.opacity-0]="!isOpen"
  [class.opacity-100]="isOpen">
  <div class="bg-white/95 backdrop-filter backdrop-blur-sm rounded-custom shadow-custom w-full max-w-md mx-4 overflow-hidden transform transition-all duration-300 border border-gray-100"
    [class.scale-95]="!isOpen"
    [class.scale-100]="isOpen"
    (click)="$event.stopPropagation()">
    
    <!-- Modal Header with Decorative Element -->
    <div class="relative">
      <!-- Decorative header accent -->
      <div class="absolute inset-0 bg-gradient-to-r from-red-500/20 to-transparent h-1 w-full"></div>
      
      <div class="flex justify-between items-center p-6 border-b border-gray-100">
        <h2 class="text-xl font-semibold text-gray-800 flex items-center">
          <span class="bg-red-100 p-2 rounded-full mr-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
            </svg>
          </span>
          Delete Contact
        </h2>
        <button class="text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-full w-8 h-8 flex items-center justify-center transition-colors focus:outline-none" (click)="closeModal()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    </div>

    <div class="p-6">
      <div class="flex flex-col items-center text-center mb-6">
        <div class="bg-red-50 p-4 rounded-full mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-red-500" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
        </div>
        <p class="text-gray-700 mb-2">Are you sure you want to delete this contact?</p>
        <p class="text-lg font-medium text-gray-900 mb-2" *ngIf="contact">
          {{ contact.first_name }} {{ contact.last_name }}
        </p>
        <p class="text-red-500 text-sm">This action cannot be undone.</p>
      </div>

      <div class="flex justify-end gap-3 border-t border-gray-100 pt-5">
        <button 
          type="button" 
          class="px-5 py-2.5 rounded-custom border border-gray-300 text-gray-700 bg-white hover:bg-gray-50 transition-colors shadow-sm flex items-center gap-2" 
          (click)="closeModal()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
          Cancel
        </button>
        <button 
          type="button" 
          class="px-5 py-2.5 rounded-custom bg-red-500 text-white hover:bg-red-600 transition-colors shadow-custom flex items-center gap-2" 
          (click)="confirmDelete()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
          Delete
        </button>
      </div>
    </div>
  </div>
</div>
