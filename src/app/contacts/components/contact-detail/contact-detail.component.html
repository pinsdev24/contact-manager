<div class="contact-detail-container">
  <div class="back-button-container">
    <a [routerLink]="['/contacts']" class="back-button">← Back to Contacts</a>
  </div>

  <div *ngIf="isLoading" class="loading">
    <p>Loading contact details...</p>
  </div>

  <div *ngIf="errorMessage" class="error-message">
    <p>{{ errorMessage }}</p>
  </div>

  <div *ngIf="!isLoading && !errorMessage && contact" class="contact-card">
    <div class="contact-header">
      <h1>{{ contact.first_name }} {{ contact.last_name }}</h1>
      <div class="contact-actions">
        <a [routerLink]="['/contacts', contact.id, 'edit']" class="edit-button">Edit</a>
        <button (click)="openDeleteModal()" class="delete-button">Delete</button>
      </div>
    </div>

    <div class="contact-photo" *ngIf="contact.photo">
      <img [src]="contact.photo" alt="{{ contact.first_name }} {{ contact.last_name }}">
    </div>
    <div class="contact-photo no-photo" *ngIf="!contact.photo">
      <div class="initials">{{ contact.first_name.charAt(0) }}{{ contact.last_name.charAt(0) }}</div>
    </div>

    <div class="contact-info">
      <div class="info-item">
        <span class="label">Email:</span>
        <span class="value">{{ contact.email }}</span>
      </div>
      <div class="info-item">
        <span class="label">Phone:</span>
        <span class="value">{{ contact.phone }}</span>
      </div>
    </div>
  </div>
</div>

<app-delete-confirmation-modal
  [isOpen]="isDeleteModalOpen"
  [contact]="contact"
  (close)="closeDeleteModal()"
  (confirm)="confirmDeleteContact()"
></app-delete-confirmation-modal>
