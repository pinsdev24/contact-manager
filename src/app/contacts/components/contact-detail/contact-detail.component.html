<div class="min-h-screen bg-background p-4 md:p-6">
  <div class="container mx-auto max-w-4xl">
    <div class="mb-6">
      <a [routerLink]="['/contacts']" class="inline-flex items-center gap-2 text-primary hover:text-primary/80 font-medium transition-colors group">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform group-hover:-translate-x-1 transition-transform" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
        </svg>
        Back to Contacts
      </a>
    </div>

    <div *ngIf="isLoading" class="bg-white/95 backdrop-filter backdrop-blur-sm rounded-custom shadow-custom p-10 text-center border border-gray-100">
      <div class="w-14 h-14 border-4 border-primary/20 border-t-primary rounded-full animate-spin mx-auto mb-4"></div>
      <p class="text-gray-600">Loading contact details...</p>
    </div>

    <div *ngIf="errorMessage" class="bg-white/95 backdrop-filter backdrop-blur-sm rounded-custom shadow-custom p-6 text-center border-l-4 border-red-500 mb-6">
      <div class="flex items-center justify-center text-red-500 mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
        </svg>
        Error
      </div>
      <p class="text-red-600">{{ errorMessage }}</p>
    </div>

    <div *ngIf="!isLoading && !errorMessage && contact" class="bg-white/95 backdrop-filter backdrop-blur-sm rounded-custom shadow-custom overflow-hidden border border-gray-100 relative max-w-2xl mx-auto">
      <!-- Decorative header accent -->
      <div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-primary/20 to-transparent"></div>
      
      <!-- Top action bar -->
      <div class="p-4 flex justify-between items-center border-b border-gray-100 relative">
        <h1 class="text-xl font-semibold text-gray-800 flex items-center">
          <span class="bg-primary/10 p-1.5 rounded-full mr-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-primary" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
            </svg>
          </span>
          Contact Details
        </h1>
        <div class="flex gap-2">
          <a [routerLink]="['/contacts', contact.id, 'edit']" class="inline-flex items-center gap-1 bg-primary text-white rounded-custom px-3 py-1.5 hover:bg-primary/90 transition-all shadow-custom transform hover:-translate-y-0.5 duration-200 text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
              <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
            </svg>
            Edit
          </a>
          <button (click)="openDeleteModal()" class="inline-flex items-center gap-1 bg-red-500 text-white rounded-custom px-3 py-1.5 hover:bg-red-600 transition-all shadow-custom transform hover:-translate-y-0.5 duration-200 text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
            </svg>
            Delete
          </button>
        </div>
      </div>

      <!-- Contact name section -->
      <div class="text-center py-5 px-4 bg-gradient-to-b from-gray-50 to-white">
        <h2 class="text-2xl font-bold text-gray-800">{{ contact.first_name }} {{ contact.last_name }}</h2>
      </div>

      <!-- Contact photo -->
      <div class="flex justify-center -mt-4 mb-4 relative z-10">
        <div *ngIf="contact.photo" class="w-28 h-28 rounded-full overflow-hidden ring-4 ring-white shadow-lg">
          <img [src]="contact.photo" alt="{{ contact.first_name }} {{ contact.last_name }}" class="w-full h-full object-cover">
        </div>
        <div *ngIf="!contact.photo" class="w-28 h-28 rounded-full bg-gradient-to-br from-primary to-[#8b85ff] flex items-center justify-center text-white text-3xl font-medium shadow-lg ring-4 ring-white">
          {{ contact.first_name.charAt(0) }}{{ contact.last_name.charAt(0) }}
        </div>
      </div>

      <!-- Contact information -->
      <div class="px-5 pb-5 pt-2 space-y-3">
        <div class="flex flex-col md:flex-row md:items-center gap-2 p-3 rounded-lg bg-gray-50 hover:bg-gray-100 transition-colors">
          <div class="flex items-center gap-2 min-w-[180px]">
            <div class="bg-primary/10 p-2 rounded-full">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-primary" viewBox="0 0 20 20" fill="currentColor">
                <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
              </svg>
            </div>
            <span class="text-gray-700 font-medium text-sm">Email</span>
          </div>
          <span class="text-gray-800 break-all text-sm">{{ contact.email }}</span>
        </div>
        
        <div class="flex flex-col md:flex-row md:items-center gap-2 p-3 rounded-lg bg-gray-50 hover:bg-gray-100 transition-colors">
          <div class="flex items-center gap-2 min-w-[180px]">
            <div class="bg-primary/10 p-2 rounded-full">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-primary" viewBox="0 0 20 20" fill="currentColor">
                <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z" />
              </svg>
            </div>
            <span class="text-gray-700 font-medium text-sm">Phone</span>
          </div>
          <span class="text-gray-800 text-sm">{{ contact.phone }}</span>
        </div>
      </div>
    </div>
  </div>
</div>

<app-delete-confirmation-modal
  [isOpen]="isDeleteModalOpen"
  [contact]="contact"
  (close)="closeDeleteModal()"
  (confirm)="confirmDeleteContact()"
></app-delete-confirmation-modal>
